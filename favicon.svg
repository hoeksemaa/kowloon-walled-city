<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <!-- The white bauhinia of the Hong Kong flag on its red field: five petals, each with a red star and a red stamen line. -->
  <rect x="-50" y="-50" width="100" height="100" rx="12" fill="#de2910"/>
  <defs>
    <g id="petal">
      <path fill="#fff" d="M1.5,-3.5 C-9,-11 -24,-23 -21,-37 C-19,-46 -8,-50 1,-47.5 C8,-45.5 13,-41 15,-35 C9,-37.5 3,-36 1.5,-30 C0,-22 5,-12 1.5,-3.5 Z"/>
      <path fill="none" stroke="#de2910" stroke-width="1.6" stroke-linecap="round" d="M-5.5,-27 C-7,-19 -4,-11 -0.5,-6"/>
      <polygon fill="#de2910" transform="translate(-6.5,-32.5) scale(4.6)"
        points="0,-1 0.2245,-0.309 0.951,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.951,-0.309 -0.2245,-0.309"/>
    </g>
  </defs>
  <g transform="rotate(-6)">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
  </g>
</svg>
