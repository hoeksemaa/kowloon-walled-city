<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kowloon Walled City · 1986</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header id="title">
    <div class="t-cn">九龍城寨</div>
    <div class="t-en">KOWLOON WALLED CITY</div>
    <div class="t-sub">ONE WEEK · 16–22 DEC 1986 · PLAN TRACED · BUSINESSES FROM THE CLEARANCE FILES</div>
  </header>

  <nav id="toolbar" class="panel" aria-label="Tools">
    <div class="tb-head"><i></i><i></i><i></i></div>
    <button class="tool" id="t-explode" title="Pull the storeys apart (E)" aria-pressed="false">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 3h9l3 2H5z M2 7h9l3 2H5z M2 11h9l3 2H5z" fill="currentColor"/></svg>
      <span class="chev">›</span>
    </button>
    <button class="tool on" id="t-wires" title="Cables and pipes (W)" aria-pressed="true">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M1 4h2v2h1v2h1v1h2v1h2V9h2V8h1V6h1V4h2v2h-1v2h-1v1h-1v1h-2v1H7v-1H5V9H4V8H3V6H1z" fill="currentColor"/></svg>
      <span class="chev">›</span>
    </button>
    <button class="tool on" id="t-people" title="People (P)" aria-pressed="true">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M6 1h4v4H6z M5 6h6v5H9v4H7v-4H5z" fill="currentColor"/></svg>
      <span class="chev">›</span>
    </button>
    <button class="tool on" id="t-map" title="Street names and places of the 1992 map (M)" aria-pressed="true">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M1 2h14v8H1z M3 4v4h2V4z M6 4v4h1V4z M8 4v1h2V4z M8 7v1h3V7z M12 4v4h1V4z M7 10h2v5H7z" fill="currentColor" fill-rule="evenodd"/></svg>
      <span class="chev">›</span>
    </button>
    <button class="tool" id="t-sound" title="Soft sound of the city (S)" aria-pressed="false">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 6h3v4H2z M5 6h1V5h1V4h1V3h1v10H8v-1H7v-1H6v-1H5z M11 6h1v4h-1z M13 4h1v8h-1z" fill="currentColor"/></svg>
      <span class="chev">›</span>
    </button>
    <button class="tool" id="t-find" title="Find them 尋人: three people of the book (G)" aria-pressed="false">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M5 1h4v1h1v1h1v1h1v4h-1v1h-1v1H9v1H5v-1H4V9H3V8H2V4h1V3h1V2h1z M5 3v1H4v4h1v1h4V8h1V4H9V3z M11 10h1v1h1v1h1v1h1v2h-2v-1h-1v-1h-1v-1h-1v-1h1z" fill="currentColor" fill-rule="evenodd"/></svg>
      <span class="chev">›</span>
    </button>
  </nav>

  <aside id="rail" class="panel" aria-label="Storeys">
    <button class="rail-head" id="rail-clear" title="Show every storey (Esc)">«</button>
    <ol id="levels"></ol>
    <div class="rail-foot">═</div>
  </aside>

  <section id="clock" class="panel" aria-label="Time">
    <div class="clk-row">
      <span id="clk-date">TUE 16 DEC 1986</span>
      <span id="clk-time"><span id="clk-h">09</span><span id="clk-colon">:</span><span id="clk-m">45</span></span>
    </div>
    <div id="spark" title="People away from home, through the day. Click to jump.">
      <canvas id="spark-c" width="288" height="44"></canvas>
      <i id="playhead"></i>
    </div>
    <div class="clk-row speeds" id="speeds">
      <button aria-pressed="false"><svg viewBox="0 0 6 7" width="12" height="14" shape-rendering="crispEdges"><path d="M0 0h2v7H0z M4 0h2v7H4z" fill="currentColor"/></svg></button>
      <button aria-pressed="true" class="on"><svg viewBox="0 0 4 7" width="8" height="14" shape-rendering="crispEdges"><path d="M0 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="currentColor"/></svg></button>
      <button aria-pressed="false"><svg viewBox="0 0 9 7" width="18" height="14" shape-rendering="crispEdges"><path d="M0 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z M5 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="currentColor"/></svg></button>
      <button aria-pressed="false"><svg viewBox="0 0 14 7" width="28" height="14" shape-rendering="crispEdges"><path d="M0 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z M5 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z M10 0h1v1h1v1h1v1h1v1h-1v1h-1v1h-1v1h-1z" fill="currentColor"/></svg></button>
    </div>
    <div id="clk-stats"></div>
  </section>

  <section id="legend" class="panel"></section>

  <section id="game" class="panel" hidden aria-label="Find them" aria-live="polite">
    <button id="game-close" title="Close (G)">×</button>
    <h2>FIND THEM 尋人</h2>
    <div id="game-body"></div>
  </section>

  <div id="tooltip" role="status"></div>
  <div id="tag"></div>
  <div id="hint">DRAG ROTATE · RIGHT-DRAG PAN · SCROLL ZOOM · CLICK A PERSON TO FOLLOW</div>

  <button id="src-btn">SOURCES + NOTES</button>
  <section id="sources" class="panel" hidden>
    <button id="src-close" title="Close">×</button>
    <h2>Sources and notes</h2>
    <div id="src-body"></div>
  </section>

  <div id="loading">BUILDING THE CITY…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
